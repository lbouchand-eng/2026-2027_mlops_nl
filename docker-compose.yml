# docker compose up --build   -> API on :8000, MLflow UI on :5001
# docker compose run --rm --build demo -> incident demo (alert then rollback), isolated registry
# docker compose --profile observability up --build -> + Prometheus :9090, Pushgateway :9091, Grafana :3000
#   then bash scripts/demo_live.sh --prepare && bash scripts/demo_live.sh (demo on the visible stack)
#
# Prerequisite: data/processed/ present (see "Quick start" in the README).
# Ports restricted to the local machine. To protect /reload: PGA_API_KEY in .env.
x-app: &app
  build: .
  image: pga-mlops
  environment: &env
    MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
    MLFLOW_DISABLE_AGENT_HINT: "1"
    PREDICTIONS_LOG: /app/data/monitoring/predictions.parquet
    PGA_MONITORING_DIR: /app/data/monitoring/reports
    PGA_TRIGGER_DIR: /app/data/monitoring/reports
    PGA_API_KEY: ${PGA_API_KEY:-}
    PGA_ALERT_WEBHOOK: ${PGA_ALERT_WEBHOOK:-}
    PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-}   # empty: monitor check pushes nothing
  volumes:
    - ./data/processed:/app/data/processed:ro
    - registry:/mlflow
    - artifacts:/app/mlartifacts   # same path everywhere: the registry references models there
    - monitoring:/app/data/monitoring

services:
  # Creates champion + previous on first launch; does nothing afterwards.
  bootstrap:
    <<: *app
    command: ["bash", "scripts/demo_setup.sh"]

  api:
    <<: *app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mlflow:
    <<: *app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"   # 5000 is taken by AirPlay on macOS
    restart: unless-stopped

  # Executes the trigger's decisions every week: docker compose --profile ops up -d
  scheduler:
    <<: *app
    profiles: ["ops"]
    depends_on:
      api:
        condition: service_healthy
    command: ["bash", "scripts/scheduler.sh"]
    environment:
      <<: *env
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS:-604800}
    restart: unless-stopped

  # Throwaway registry (mlflow_incident.db inside the container): leaves the stack untouched.
  demo:
    <<: *app
    profiles: ["demo"]
    command: ["bash", "-c", "bash scripts/demo.sh --prepare && bash scripts/demo.sh $${DEMO_ARGS:-}"]
    environment:
      <<: *env
      PORT: "8010"
      DEMO_ARGS: ${DEMO_ARGS:-}
    stdin_open: true
    tty: true
    volumes:
      - ./data/processed:/app/data/processed:ro

  # --- Observability: docker compose --profile observability up --build ----------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  # Receives the signals from `pga.monitor check` (short-lived process that Prometheus can't scrape).
  pushgateway:
    image: prom/pushgateway:v1.11.1
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    restart: unless-stopped

  # Anonymous admin access, no login form: no password to manage,
  # acceptable because the port only listens on the local machine.
  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pga-mlops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  registry:
  artifacts:
  monitoring:
  prometheus:
