# docker compose up --build   -> API sur :8000, interface MLflow sur :5001
# docker compose run --rm --build demo -> démo de l'incident (alerte puis rollback), registry isolé
# docker compose --profile observability up --build -> + Prometheus :9090, Pushgateway :9091, Grafana :3000
#   puis bash scripts/demo_live.sh --prepare && bash scripts/demo_live.sh (démo sur la stack visible)
#
# Prérequis : data/processed/ présent (voir « Démarrage rapide » du README).
# Ports limités à la machine locale. Pour protéger /reload : PGA_API_KEY dans .env.
x-app: &app
  build: .
  image: pga-mlops
  environment: &env
    MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
    MLFLOW_DISABLE_AGENT_HINT: "1"
    PREDICTIONS_LOG: /app/data/monitoring/predictions.parquet
    PGA_MONITORING_DIR: /app/data/monitoring/reports
    PGA_TRIGGER_DIR: /app/data/monitoring/reports
    PGA_API_KEY: ${PGA_API_KEY:-}
    PGA_ALERT_WEBHOOK: ${PGA_ALERT_WEBHOOK:-}
    PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-}   # vide : monitor check ne pousse rien
  volumes:
    - ./data/processed:/app/data/processed:ro
    - registry:/mlflow
    - artifacts:/app/mlartifacts   # même chemin partout : le registry y référence les modèles
    - monitoring:/app/data/monitoring

services:
  # Crée champion + previous au premier lancement ; ne fait rien ensuite.
  bootstrap:
    <<: *app
    command: ["bash", "scripts/demo_setup.sh"]

  api:
    <<: *app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mlflow:
    <<: *app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"   # 5000 est pris par AirPlay sur macOS
    restart: unless-stopped

  # Exécute les décisions du déclencheur chaque semaine : docker compose --profile ops up -d
  scheduler:
    <<: *app
    profiles: ["ops"]
    depends_on:
      api:
        condition: service_healthy
    command: ["bash", "scripts/scheduler.sh"]
    environment:
      <<: *env
      TRIGGER_INTERVAL_SECONDS: ${TRIGGER_INTERVAL_SECONDS:-604800}
    restart: unless-stopped

  # Registry jetable (mlflow_incident.db dans le conteneur) : n'altère pas la stack.
  demo:
    <<: *app
    profiles: ["demo"]
    command: ["bash", "-c", "bash scripts/demo.sh --prepare && bash scripts/demo.sh $${DEMO_ARGS:-}"]
    environment:
      <<: *env
      PORT: "8010"
      DEMO_ARGS: ${DEMO_ARGS:-}
    stdin_open: true
    tty: true
    volumes:
      - ./data/processed:/app/data/processed:ro

  # --- Observabilité : docker compose --profile observability up --build ---------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  # Reçoit les signaux de `pga.monitor check` (processus court, que Prometheus ne peut pas scraper).
  pushgateway:
    image: prom/pushgateway:v1.11.1
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    restart: unless-stopped

  # Accès anonyme en admin, sans formulaire de connexion : aucun mot de passe à gérer,
  # acceptable parce que le port n'écoute que sur la machine locale.
  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pga-mlops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  registry:
  artifacts:
  monitoring:
  prometheus:
