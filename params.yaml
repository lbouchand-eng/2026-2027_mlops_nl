collect:
  # Années civiles couvertes (date de début de tournoi). Les saisons ESPN chevauchent
  # deux années (saison 2023 = sept. 2022 -> août 2023) : on interroge une saison de plus.
  first_year: 2016
  last_year: 2024
  request_interval_s: 1.0   # throttle entre deux requêtes réseau
  timeout_s: 30

rounds:
  # Événements exclus : formats non stroke-play individuel
  exclude_name_patterns:
    - "Presidents Cup"
    - "Ryder Cup"
    - "Zurich Classic"
    - "QBE Shootout"
    - "Hero World Challenge"
    - "Match Play"
    - "Grant Thornton"
    - "Olympic"

weather:
  window_hours: 5           # durée de la fenêtre de jeu à partir du teeTime
  wind_median_kmh: [6, 20]  # médiane acceptée (9,2 à 12,1 selon les années ; un backfill en m/s donne ≈ 3)
  hourly:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - wind_speed_10m
    - wind_gusts_10m
    - wind_direction_10m

features:
  form_window_short: 10     # nb de tours pour la forme courte
  form_window_long: 40      # nb de tours pour la forme longue
  form_window_xlong: 150    # niveau de fond du joueur
  form_ewm_halflife: 15     # demi-vie (en tours) de la moyenne exponentielle
  form_ewm_halflife_slow: 50
  form_min_periods: 3       # tours minimum avant de calculer une moyenne glissante
  form_min_periods_xlong: 10
  course_shrink_k: 8        # pseudo-tours de rétrécissement de l'historique parcours vers 0

split:
  history: [2016, 2017]
  reference: [2018, 2022]
  drift: [2023, 2024]

train:
  train_years: [2018, 2021]   # fit pour la validation (2018 = 1re année avec météo prévue complète)
  valid_years: [2022, 2022]   # décision de promotion
  refit_years: [2018, 2022]   # modèle enregistré : toute la période de référence
  eval_years: [2023, 2024]    # période de drift : informatif, jamais utilisé pour décider
  random_state: 42
  registered_model_name: pga-score-model
  model:
    learning_rate: 0.05
    max_iter: 300
    max_leaf_nodes: 31
    min_samples_leaf: 200
    l2_regularization: 1.0

monitor:
  reference_years: [2018, 2022]   # repli si le modèle servi n'a pas de reference_profile.json
  window_events: 8                # fenêtre glissante (≈ 2 mois de saison)
  min_rows: 500                   # en dessous : signaux non évalués (journal court, scores absents)
  psi_bins: 10
  psi_warning: 0.10               # planchers ; seuils effectifs par feature dans
  psi_alert: 0.25                 # reports/monitoring/calibration.json (commande calibrate)
  calibration_quantile: 0.99      # warning = quantile 99 % du PSI naturel (fenêtres 2018-2022)
  calibration_alert_margin: 1.5   # alert = 1,5 x PSI naturel max
  # Features surveillées par PSI : niveau joueur et météo. Exclues : compteurs cumulés
  # (n_rounds_hist, course_n_rounds) qui dérivent mécaniquement, et features constantes
  # par tournoi (parcours, contexte) dont le PSI sur 8 tournois n'a pas de sens.
  psi_features: [form_rel_short, form_rel_long, form_rel_xlong, form_ewm, form_ewm_slow,
                 days_since_last, course_rel_mean, fc_temp_mean, fc_humidity_mean,
                 fc_precip_sum, fc_wind_mean, fc_gust_max]
  bias_z_warning: 2.0
  bias_z_alert: 3.0
  mae_ratio_alert: 1.10           # ≈ 3 erreurs-types de la MAE sur 8 tournois
  fallback_event_bias_sd: 0.85    # si la version servie n'a pas le tag valid_event_bias_sd

trigger:
  consecutive_checks: 3           # contrôles de performance consécutifs hors seuil -> dégradation confirmée
  recent_promotion_days: 60       # champion mis en service depuis moins de 60 j : dégradation -> rollback
  train_start_year: 2018          # début des données du challenger
  bias_tolerance: 0.0             # |biais| challenger <= |biais| champion + tolérance
