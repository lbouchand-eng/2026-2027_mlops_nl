collect:
  # Calendar years covered (tournament start date). ESPN seasons span
  # two years (2023 season = Sept. 2022 -> Aug. 2023): we query one extra season.
  first_year: 2016
  last_year: 2024
  request_interval_s: 1.0   # throttle between two network requests
  timeout_s: 30

rounds:
  # Excluded events: non-individual-stroke-play formats
  exclude_name_patterns:
    - "Presidents Cup"
    - "Ryder Cup"
    - "Zurich Classic"
    - "QBE Shootout"
    - "Hero World Challenge"
    - "Match Play"
    - "Grant Thornton"
    - "Olympic"

weather:
  window_hours: 5           # playing window duration from teeTime
  wind_median_kmh: [6, 20]  # accepted median (9.2 to 12.1 depending on the year; a backfill in m/s gives ≈ 3)
  hourly:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - wind_speed_10m
    - wind_gusts_10m
    - wind_direction_10m

features:
  form_window_short: 10     # nb of rounds for short form
  form_window_long: 40      # nb of rounds for long form
  form_window_xlong: 150    # player's underlying level
  form_ewm_halflife: 15     # half-life (in rounds) of the exponential mean
  form_ewm_halflife_slow: 50
  form_min_periods: 3       # minimum rounds before computing a rolling mean
  form_min_periods_xlong: 10
  course_shrink_k: 8        # pseudo-rounds shrinking the course history towards 0

split:
  history: [2016, 2017]
  reference: [2018, 2022]
  drift: [2023, 2024]

train:
  train_years: [2018, 2021]   # fit for validation (2018 = 1st year with a complete weather forecast)
  valid_years: [2022, 2022]   # promotion decision
  refit_years: [2018, 2022]   # registered model: the whole reference period
  eval_years: [2023, 2024]    # drift period: informational, never used for decisions
  random_state: 42
  registered_model_name: pga-score-model
  model:
    learning_rate: 0.05
    max_iter: 300
    max_leaf_nodes: 31
    min_samples_leaf: 200
    l2_regularization: 1.0

monitor:
  reference_years: [2018, 2022]   # fallback if the served model has no reference_profile.json
  window_events: 8                # rolling window (≈ 2 months of season)
  min_rows: 500                   # below: signals not evaluated (short prediction journal, missing scores)
  psi_bins: 10
  psi_warning: 0.10               # floors; effective per-feature thresholds in
  psi_alert: 0.25                 # reports/monitoring/calibration.json (calibrate command)
  calibration_quantile: 0.99      # warning = 99% quantile of natural PSI (2018-2022 windows)
  calibration_alert_margin: 1.5   # alert = 1.5 x max natural PSI
  # Features monitored by PSI: player level and weather. Excluded: cumulative counters
  # (n_rounds_hist, course_n_rounds) that drift mechanically, and features constant
  # per tournament (course, context) whose PSI over 8 tournaments is meaningless.
  psi_features: [form_rel_short, form_rel_long, form_rel_xlong, form_ewm, form_ewm_slow,
                 days_since_last, course_rel_mean, fc_temp_mean, fc_humidity_mean,
                 fc_precip_sum, fc_wind_mean, fc_gust_max]
  bias_z_warning: 2.0
  bias_z_alert: 3.0
  mae_ratio_alert: 1.10           # ≈ 3 standard errors of the MAE over 8 tournaments
  fallback_event_bias_sd: 0.85    # if the served version lacks the valid_event_bias_sd tag
  # Two-sided CUSUM of the per-tournament bias (z = bias / σ_tournament), accumulated over the full history:
  # detects a small persistent bias that the 8-tournament window dilutes. k = 0.5 targets a
  # 1 σ_tournament shift; thresholds checked out of sample on 2019-2022 (docs/monitoring.md).
  cusum_k: 0.5
  cusum_h_warning: 3.0
  cusum_h_alert: 4.0

trigger:
  consecutive_checks: 3           # consecutive performance checks over threshold -> confirmed degradation
  recent_promotion_days: 60       # champion deployed less than 60 days ago: degradation -> rollback
  train_start_year: 2018          # start of the challenger's data
  bias_tolerance: 0.0             # |bias| challenger <= |bias| champion + tolerance
