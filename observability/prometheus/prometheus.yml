# Prometheus de la stack (profil Compose « observability »).
# Intervalle court (5 s) : chaque étape de la démo est visible dans Grafana quelques secondes après.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # API FastAPI : requêtes, latence de l'inférence, lignes prédites, version servie.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Signaux du monitoring, poussés par `pga.monitor check` (job pga_monitor).
  - job_name: pushgateway
    honor_labels: true   # garde job="pga_monitor" poussé par le contrôle
    static_configs:
      - targets: ["pushgateway:9091"]
