name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dependencies (uv.lock, no update)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (no DVC data required)
        run: uv run pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t pga-mlops .

      - name: The service starts and responds (no model, no data)
        run: |
          docker run -d --name api -p 8000:8000 pga-mlops
          for _ in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | grep '"status":"no_model"'
